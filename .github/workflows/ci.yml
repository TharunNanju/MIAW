name: POC CI Pipeline

on:
  push:
    branches:
      - testing
      - development
  pull_request:
    branches:
      - development
      - main

jobs:
  poc-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: CI bootstrap check
        run: |
          echo "CI pipeline is set up correctly"
          echo "Repository contents:"
          ls -la

