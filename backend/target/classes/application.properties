spring.datasource.url=jdbc:h2:file:./data/miaw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# JWT configuration (replace secret for production)
jwt.secret=change-me-use-a-strong-secret-key-32bytes
jwt.access-token-validity-minutes=15
jwt.refresh-token-validity-days=30
